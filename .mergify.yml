pull_request_rules:
  - name: bbp test label
    conditions:
      - base = main
    actions:
      label:
        add: ["bbp-test"]
  - name: bbp queue
    conditions:
      - base = main
      - label = bbp-queue
    actions:
      queue:
        name: bbp

merge_protections_settings:
  auto_merge_conditions: true

merge_protections:
  - name: reviewer-required
    description: require at least one human approval before merge
    if:
      - base = main
    success_conditions:
      - "#approved-reviews-by >= 1"

queue_rules:
  - name: bbp
    merge_conditions:
      - check-success = bbp-never-passes
