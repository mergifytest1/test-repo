pull_request_rules:
  - name: bbp test label
    conditions:
      - base = main
    actions:
      label:
        add: ["bbp-test"]
  - name: bbp queue
    conditions:
      - base = main
      - label = bbp-queue
    actions:
      queue:
        name: bbp

merge_protections_settings:
  auto_merge_conditions: true

merge_protections:
  - name: human-acceptance-required
    description: a human with write access must accept the change before it can merge
    if:
      - base = main
    success_conditions:
      - "label = human-accepted"

queue_rules:
  - name: bbp
    merge_conditions:
      - check-success = bbp-never-passes
